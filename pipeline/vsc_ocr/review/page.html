<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book Review</title>
<style>
:root {
  --bg: #f7f6f3; --panel: #ffffff; --ink: #1f1f1f; --muted: #6b6b6b; --line: #e2e0da;
  --accent: #2f6fde; --accent-soft: #e6eefc; --flag: #c27c00; --flag-soft: #fff4dc;
  --box: rgba(47, 111, 222, .22); --box-edge: #2f6fde; --danger: #c0392b;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #17181a; --panel: #1f2023; --ink: #e8e6e1; --muted: #9a9892; --line: #34353a;
    --accent: #6d9cf0; --accent-soft: #233150; --flag: #e3a63a; --flag-soft: #3a2f17;
    --box: rgba(109, 156, 240, .25); --box-edge: #6d9cf0; --danger: #e5675a;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 -apple-system, "Segoe UI", system-ui, sans-serif;
       display: flex; flex-direction: column; }
header { display: flex; gap: 8px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line);
         background: var(--panel); flex-wrap: wrap; }
header h1 { font-size: 14px; margin: 0 8px 0 0; font-weight: 600; white-space: nowrap; }
select, button { font: inherit; font-size: 13px; color: var(--ink); background: var(--panel);
                 border: 1px solid var(--line); border-radius: 6px; padding: 4px 9px; cursor: pointer; }
select { max-width: 42ch; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
button.danger { color: var(--danger); }
#status { margin-left: auto; font-size: 12px; color: var(--muted); white-space: nowrap; }
#status.err { color: var(--danger); }
main { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); min-height: 0; }
#text { overflow-y: auto; padding: 16px 20px 40vh; border-right: 1px solid var(--line); }
.block { padding: 6px 10px; margin: 2px 0 8px; border-left: 3px solid transparent; border-radius: 4px;
         white-space: pre-wrap; cursor: pointer; }
.block:hover { background: var(--panel); }
.block.flag { border-left-color: var(--flag); background: var(--flag-soft); }
.block.k-heading { font-weight: 650; font-size: 17px; }
.block.k-comment { color: var(--muted); font-size: 12px; font-family: ui-monospace, Menlo, monospace; }
.block.k-note { font-size: 13.5px; }
.block.k-break { text-align: center; color: var(--muted); }
.block.nomatch .pg { color: var(--danger); }
.block.active { background: var(--panel); border-left-color: var(--accent); box-shadow: 0 0 0 1px var(--line); cursor: default; }
.pg { float: right; font-size: 11px; color: var(--muted); margin-left: 8px; }
textarea { width: 100%; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line);
           border-radius: 4px; padding: 6px; resize: vertical; min-height: 4em; }
textarea:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
.actions { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; align-items: center; }
.actions .hint { font-size: 11px; color: var(--muted); margin-left: auto; }
#scan { display: flex; flex-direction: column; min-height: 0; }
#scanbar { display: flex; gap: 6px; align-items: center; padding: 6px 12px; border-bottom: 1px solid var(--line);
           background: var(--panel); font-size: 13px; flex-wrap: wrap; }
#scanbar .tab.on { background: var(--accent-soft); border-color: var(--accent); }
#scanview { flex: 1; overflow: auto; padding: 12px; }
#sheet { position: relative; margin: 0 auto; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.15); }
#sheet img { display: block; width: 100%; }
.box { position: absolute; background: var(--box); outline: 2px solid var(--box-edge); border-radius: 2px;
       cursor: move; touch-action: none; }
.box.dragging { outline-style: dashed; }
.empty { color: var(--muted); padding: 40px; text-align: center; }
kbd { font: 11px ui-monospace, Menlo, monospace; border: 1px solid var(--line); border-radius: 3px; padding: 0 3px; }
@media (max-width: 800px) {
  main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
  #text { border-right: 0; border-bottom: 1px solid var(--line); padding: 12px 16px 20vh; }
}
</style>
</head>
<body>
<header>
  <h1 id="title">…</h1>
  <button id="prevSec" title="Previous section">‹</button>
  <select id="sections"></select>
  <button id="nextSec" title="Next section">›</button>
  <button id="nextFlag" title="Next ⚠ (Alt+Shift+↓)">Next ⚠</button>
  <span id="status"></span>
</header>
<main>
  <section id="text"></section>
  <section id="scan">
    <div id="scanbar">
      <button id="prevPage">‹</button>
      <span id="pageLabel">–</span>
      <button id="nextPage">›</button>
      <span id="tabs"></span>
      <span style="margin-left:auto"></span>
      <button data-zoom="1">Fit</button>
      <button data-zoom="1.5">150%</button>
      <button data-zoom="2.2">220%</button>
    </div>
    <div id="scanview"><div id="sheet"><img id="img" alt=""></div></div>
  </section>
</main>
<script>
const $ = s => document.querySelector(s);
const state = { book: null, sec: 0, data: null, active: null, page: null, zoom: 1, dirty: false };
try { state.zoom = +localStorage.getItem("zoom") || 1; } catch (e) {}

function status(msg, err) { const s = $("#status"); s.textContent = msg; s.className = err ? "err" : ""; }

async function api(path, body) {
  const r = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" },
                                      body: JSON.stringify(body) } : {});
  const j = await r.json();
  if (r.status === 409) { status("book.md changed on disk, reloaded", true); await loadBook(); throw new Error("conflict"); }
  if (!r.ok) { status(j.error || r.statusText, true); throw new Error(j.error); }
  return j;
}

async function loadBook(keepSection) {
  state.book = await api("/api/book");
  $("#title").textContent = state.book.title;
  document.title = state.book.title + " · review";
  const sel = $("#sections");
  sel.innerHTML = "";
  state.book.sections.forEach((s, k) => {
    const o = document.createElement("option");
    o.value = k;
    o.textContent = "  ".repeat(Math.max(0, s.level - 1)) + s.title + (s.flags ? `  ⚠${s.flags}` : "");
    sel.appendChild(o);
  });
  let k = keepSection ?? +(location.hash.slice(1) || 0);
  await loadSection(k);
}

async function loadSection(k, focusIndex) {
  state.data = await api(`/api/section/${k}`);
  state.sec = state.data.index;
  $("#sections").value = state.sec;
  history.replaceState(null, "", "#" + state.sec);
  state.active = null; state.dirty = false;
  renderBlocks();
  const blocks = state.data.blocks;
  const target = blocks.find(b => b.i === focusIndex) || blocks.find(b => b.kind === "text") || blocks[0];
  if (target) activate(target.i, focusIndex === undefined);
  else showPage(state.data.pdf ? state.data.pdf[0] : 1, []);
  const s = state.book.sections[state.sec];
  status(`${blocks.length} blocks · pdf ${s.pdf ? s.pdf.join("–") : "?"} · ⚠ ${s.flags}`);
}

function pagesOf(b) { return [...new Set(b.boxes.map(x => x.page))].sort((a, c) => a - c); }

function renderBlocks() {
  const el = $("#text");
  el.innerHTML = "";
  for (const b of state.data.blocks) {
    const d = document.createElement("div");
    d.className = `block k-${b.kind}` + (b.text.includes("⚠") ? " flag" : "");
    d.dataset.i = b.i;
    const pages = pagesOf(b);
    if (b.kind !== "comment" && b.kind !== "break") {
      const pg = document.createElement("span");
      pg.className = "pg";
      pg.textContent = pages.length ? "p." + pages.join(",") : "not found on scan";
      if (!pages.length) d.classList.add("nomatch");
      d.appendChild(pg);
    }
    d.appendChild(document.createTextNode(b.text));
    d.addEventListener("click", () => { if (state.active !== b.i) activate(b.i); });
    el.appendChild(d);
  }
}

function blockByIndex(i) { return state.data.blocks.find(b => b.i === i); }

function nearestPage(i) {
  const bs = state.data.blocks, at = bs.findIndex(b => b.i === i);
  for (let d = 0; d < bs.length; d++) {
    for (const j of [at - d, at + d]) if (bs[j] && bs[j].boxes.length) return pagesOf(bs[j])[0];
  }
  return state.data.pdf ? state.data.pdf[0] : 1;
}

async function activate(i, noScroll) {
  if (state.dirty && !(await save())) return;
  const prev = document.querySelector(".block.active");
  if (prev) restore(prev);
  const b = blockByIndex(i);
  if (!b) return;
  state.active = i; state.dirty = false;
  const d = document.querySelector(`.block[data-i="${i}"]`);
  d.classList.add("active");
  d.innerHTML = "";
  const ta = document.createElement("textarea");
  ta.value = b.text;
  ta.spellcheck = false;
  ta.addEventListener("input", () => { state.dirty = ta.value !== b.text; fit(ta); });
  d.appendChild(ta);
  const bar = document.createElement("div");
  bar.className = "actions";
  bar.innerHTML = `<button class="primary" data-a="save">Save</button>
    <button data-a="cancel">Revert</button>
    <button data-a="unflag" ${b.text.includes("⚠") ? "" : "disabled"}>Clear ⚠</button>
    <button data-a="merge">Merge with next</button>
    <button class="danger" data-a="delete">Delete</button>
    <span class="hint"><kbd>⌘↵</kbd> save · <kbd>Esc</kbd> revert · <kbd>⌥↓</kbd>/<kbd>⌥↑</kbd> next/prev · blank line splits</span>`;
  bar.addEventListener("click", e => {
    const a = e.target.dataset.a;
    if (a === "save") save();
    if (a === "cancel") { ta.value = b.text; state.dirty = false; fit(ta); }
    if (a === "unflag") { ta.value = unflag(ta.value); state.dirty = true; save(); }
    if (a === "merge") merge(i);
    if (a === "delete" && confirm("Delete this block?")) { ta.value = ""; state.dirty = true; save(); }
  });
  d.appendChild(bar);
  fit(ta);
  ta.focus({ preventScroll: true });
  if (!noScroll) d.scrollIntoView({ block: "nearest", behavior: "smooth" });
  const pages = pagesOf(b);
  showPage(pages[0] ?? nearestPage(i), b.boxes, pages);
}

function restore(d) {
  const b = blockByIndex(+d.dataset.i);
  d.classList.remove("active");
  d.innerHTML = "";
  if (b) {
    const pages = pagesOf(b);
    if (b.kind !== "comment" && b.kind !== "break") {
      const pg = document.createElement("span");
      pg.className = "pg";
      pg.textContent = pages.length ? "p." + pages.join(",") : "not found on scan";
      d.appendChild(pg);
    }
    d.appendChild(document.createTextNode(b.text));
  }
}

function fit(ta) { ta.style.height = "auto"; ta.style.height = ta.scrollHeight + 4 + "px"; }

function unflag(t) {
  return t.replace(/⚠ dropcap\? /g, "").replace(/ ⚠(?=  \n|\n| <!--|$)/g, "");
}

async function save() {
  const ta = document.querySelector(".block.active textarea");
  if (!ta || state.active === null) return true;
  if (!state.dirty) return true;
  status("saving…");
  try {
    const r = await api("/api/edit", { version: state.book.version, index: state.active, text: ta.value });
    state.dirty = false;
    await refresh(r, state.active);
    status("saved");
    return true;
  } catch (e) { return false; }
}

async function merge(i) {
  if (state.dirty && !(await save())) return;
  status("merging…");
  try {
    const r = await api("/api/merge", { version: state.book.version, index: i });
    await refresh(r, i);
    status("merged");
  } catch (e) {}
}

async function refresh(r, focusIndex) {
  const scroll = $("#text").scrollTop;
  state.book = await api("/api/book");
  const sel = $("#sections");
  state.book.sections.forEach((s, k) => {
    if (sel.options[k]) sel.options[k].textContent =
      "  ".repeat(Math.max(0, s.level - 1)) + s.title + (s.flags ? `  ⚠${s.flags}` : "");
  });
  if (sel.options.length !== state.book.sections.length) return loadBook(r.section);
  state.data = await api(`/api/section/${r.section}`);
  state.sec = state.data.index;
  sel.value = state.sec;
  state.active = null; state.dirty = false;
  renderBlocks();
  $("#text").scrollTop = scroll;
  const b = blockByIndex(focusIndex) || state.data.blocks[state.data.blocks.length - 1];
  if (b) activate(b.i, true);
}

function showPage(n, boxes, tabs) {
  state.page = n;
  state.boxes = boxes || [];
  $("#pageLabel").textContent = "pdf p." + n;
  const t = $("#tabs");
  t.innerHTML = "";
  if (tabs && tabs.length > 1) for (const p of tabs) {
    const btn = document.createElement("button");
    btn.className = "tab" + (p === n ? " on" : "");
    btn.textContent = "p." + p;
    btn.onclick = () => showPage(p, state.boxes, tabs);
    t.appendChild(btn);
  }
  const img = $("#img"), sheet = $("#sheet");
  sheet.style.width = (state.zoom * 100) + "%";
  sheet.querySelectorAll(".box").forEach(x => x.remove());
  const draw = () => {
    const mine = state.boxes.filter(x => x.page === n);
    for (const x of mine) {
      const d = document.createElement("div");
      d.className = "box";
      d.title = "Drag to move, drag an edge or corner to resize";
      place(d, x.bbox);
      draggable(d, x);
      sheet.appendChild(d);
    }
    if (mine.length) {
      const v = $("#scanview"), top = Math.min(...mine.map(x => x.bbox[1])) * img.clientHeight;
      if (top < v.scrollTop || top > v.scrollTop + v.clientHeight - 80) v.scrollTo({ top: Math.max(0, top - 60), behavior: "smooth" });
    }
  };
  const src = "/scan/" + n;
  if (img.getAttribute("src") !== src) { img.onload = draw; img.onerror = () => status(`no scan for page ${n}`, true); img.src = src; }
  else draw();
}

function place(d, [x0, y0, x1, y1]) {
  Object.assign(d.style, { left: x0 * 100 + "%", top: y0 * 100 + "%",
                           width: (x1 - x0) * 100 + "%", height: (y1 - y0) * 100 + "%" });
}

const MIN_BOX = 0.005;
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

function edgesAt(d, e) {
  const r = d.getBoundingClientRect(), w = Math.min(7, r.width / 3), h = Math.min(7, r.height / 3);
  return { l: e.clientX - r.left < w, r: r.right - e.clientX < w, t: e.clientY - r.top < h, b: r.bottom - e.clientY < h };
}

function cursorFor({ l, r, t, b }) {
  if ((l && t) || (r && b)) return "nwse-resize";
  if ((r && t) || (l && b)) return "nesw-resize";
  if (l || r) return "ew-resize";
  if (t || b) return "ns-resize";
  return "move";
}

// Move a box, or resize it by an edge or corner, when it doesn't cover all of
// its text. Only on screen: the box changes for this visit, nothing is saved.
function draggable(d, x) {
  d.addEventListener("pointermove", e => { if (!d.hasPointerCapture(e.pointerId)) d.style.cursor = cursorFor(edgesAt(d, e)); });
  d.addEventListener("pointerdown", e => {
    if (e.button !== 0) return;
    e.preventDefault();
    const sheet = $("#sheet").getBoundingClientRect(), from = [...x.bbox], ed = edgesAt(d, e);
    const move = !(ed.l || ed.r || ed.t || ed.b), sx = e.clientX, sy = e.clientY;
    d.setPointerCapture(e.pointerId);
    d.classList.add("dragging");
    const onMove = ev => {
      const dx = (ev.clientX - sx) / sheet.width, dy = (ev.clientY - sy) / sheet.height;
      let [x0, y0, x1, y1] = from;
      if (move) {
        const mx = clamp(dx, -x0, 1 - x1), my = clamp(dy, -y0, 1 - y1);
        x0 += mx; x1 += mx; y0 += my; y1 += my;
      } else {
        if (ed.l) x0 = clamp(x0 + dx, 0, x1 - MIN_BOX);
        if (ed.r) x1 = clamp(x1 + dx, x0 + MIN_BOX, 1);
        if (ed.t) y0 = clamp(y0 + dy, 0, y1 - MIN_BOX);
        if (ed.b) y1 = clamp(y1 + dy, y0 + MIN_BOX, 1);
      }
      x.bbox = [x0, y0, x1, y1];
      place(d, x.bbox);
    };
    const end = () => {
      d.classList.remove("dragging");
      d.removeEventListener("pointermove", onMove);
      d.removeEventListener("pointerup", end);
      d.removeEventListener("pointercancel", end);
    };
    d.addEventListener("pointermove", onMove);
    d.addEventListener("pointerup", end);
    d.addEventListener("pointercancel", end);
  });
}

$("#sections").addEventListener("change", async e => { if (!state.dirty || await save()) loadSection(+e.target.value); });
$("#prevSec").onclick = async () => { if (!state.dirty || await save()) loadSection(Math.max(0, state.sec - 1)); };
$("#nextSec").onclick = async () => { if (!state.dirty || await save()) loadSection(state.sec + 1); };
$("#prevPage").onclick = () => showPage(Math.max(1, state.page - 1), state.boxes);
$("#nextPage").onclick = () => showPage(state.page + 1, state.boxes);
document.querySelectorAll("[data-zoom]").forEach(b => b.onclick = () => {
  state.zoom = +b.dataset.zoom;
  try { localStorage.setItem("zoom", state.zoom); } catch (e) {}
  showPage(state.page, state.boxes);
});

function step(dir) {
  const bs = state.data.blocks, at = bs.findIndex(b => b.i === state.active);
  const next = bs[at + dir];
  if (next) activate(next.i);
  else if (dir > 0 && state.sec + 1 < state.book.sections.length) loadSection(state.sec + 1);
  else if (dir < 0 && state.sec > 0) loadSection(state.sec - 1);
}

async function nextFlag() {
  if (state.dirty && !(await save())) return;
  const bs = state.data.blocks, at = bs.findIndex(b => b.i === state.active);
  const here = bs.slice(at + 1).find(b => b.text.includes("⚠"));
  if (here) return activate(here.i);
  const k = state.book.sections.findIndex((s, j) => j > state.sec && s.flags);
  if (k < 0) return status("no more ⚠ after this section");
  await loadSection(k);
  const first = state.data.blocks.find(b => b.text.includes("⚠"));
  if (first) activate(first.i);
}
$("#nextFlag").onclick = nextFlag;

document.addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter") { e.preventDefault(); save(); }
  else if (e.key === "Escape") {
    const ta = document.querySelector(".block.active textarea"), b = blockByIndex(state.active);
    if (ta && b) { ta.value = b.text; state.dirty = false; fit(ta); }
  }
  else if (e.altKey && e.shiftKey && e.key === "ArrowDown") { e.preventDefault(); nextFlag(); }
  else if (e.altKey && e.key === "ArrowDown") { e.preventDefault(); step(1); }
  else if (e.altKey && e.key === "ArrowUp") { e.preventDefault(); step(-1); }
});
window.addEventListener("beforeunload", e => { if (state.dirty) { e.preventDefault(); e.returnValue = ""; } });

loadBook().catch(e => status(String(e.message || e), true));
</script>
</body>
</html>
